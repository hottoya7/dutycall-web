<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>통화체크 현황</title><meta name="theme-color" content="#3B5BDB">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0f1115;--card:#171a20;--line:#262a33;--tx:#e8eaee;--sub:#8b93a1;--red:#ef5350;--amb:#ffa726;--grn:#26a778}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--line:#e3e6ea;--tx:#15181d;--sub:#6b7380}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,'Noto Sans KR',sans-serif;padding:14px;max-width:560px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top b{font-size:18px}.top small{color:var(--sub);font-size:11px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--sub);padding:8px;border-radius:8px;font-size:13px}.seg .on{background:var(--line);color:var(--tx)}
.sum{display:flex;gap:14px;margin-bottom:6px}.sum b{font-size:16px}
.grp{font-size:12px;font-weight:700;margin:12px 2px 6px}
.row{background:var(--card);border-radius:8px;margin-bottom:5px;overflow:hidden;border-left:4px solid var(--c)}
.hd{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:9px 10px;cursor:pointer}
.hd b{font-size:15px}.n{font-size:12px;line-height:1.35}.n small{display:block;color:var(--c);font-size:11px}.t{font-size:11px;color:var(--sub)}
.det{display:none;padding:0 10px 10px;border-top:1px solid var(--line)}.row.open .det{display:block}
.det .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 3px}.bar i{display:block;height:100%;background:var(--c)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--sub);margin-top:8px}.g b{color:var(--tx);font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}.sec b{font-size:13px}.sec span{font-size:11px;color:var(--sub)}
.nx{background:var(--bg);border-radius:10px;padding:10px 12px}.nx .m{font-size:12px;color:var(--sub)}.nxb{font-size:17px;color:#7c8cf8}.nx0{font-size:13px;color:var(--sub)}
.cp{display:inline-block;font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:9px;padding:2px 9px;margin:8px 6px 0 0}.cp b{color:var(--tx);font-weight:600}
.rc>div{display:grid;grid-template-columns:92px 1fr auto;gap:8px;padding:7px 0;font-size:12.5px}.rc>div+div{border-top:1px solid var(--line)}.rc .w{color:var(--sub)}.rc .o{color:#7c8cf8}.rc .i{color:var(--grn)}.rc .r{text-align:right}.rc .x{color:var(--amb)}
@media (prefers-color-scheme:light){.nxb,.rc .o,.nt{color:#3b5bdb}.nxt{border-color:#3b5bdb}}
.more{text-align:center;color:var(--sub);font-size:12px;padding:10px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--sub);font-weight:400;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid var(--line)}
.gp{background:var(--card);border-radius:10px;margin-bottom:8px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer}
.gh span{font-weight:400;font-size:11px;color:var(--sub)}.gp.shut .ln{display:none}.gp.shut .gh{border-bottom:0}
.ln{border-left:4px solid var(--c)}.ln+.ln{border-top:1px solid var(--line)}
.lh{display:grid;grid-template-columns:fit-content(40%) 1fr auto;gap:8px;align-items:center;padding:8px 12px;cursor:pointer}
.lh b{font-size:14px;text-transform:uppercase;min-width:42px;overflow-wrap:anywhere}.ln .n{font-size:12px;line-height:1.3}.ln .n small{display:block;color:var(--c);font-size:11px}
.ln .bar{height:5px;margin:4px 0 0}.ln .det{margin:0 12px;padding:0 0 10px}.ln.open .det{display:block}
.dl{margin-top:8px;border:1px solid var(--red);background:none;color:var(--red);border-radius:8px;padding:7px 12px;font-size:12px}.dl.on{background:var(--red);color:#fff}
.t{text-align:right}.bt{display:block;font-size:10.5px;margin-top:2px;white-space:nowrap}.bt.lo{color:var(--amb)}.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;margin:3px 4px 0 0;border:1px solid var(--c2);color:var(--c2)}.cg{--c2:var(--sub)}.ca{--c2:var(--amb)}
.nt{display:block;margin-top:2px;font-size:11px;font-weight:700;color:#7c8cf8;white-space:nowrap}
.nxt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid #7c8cf8;border-radius:10px;padding:10px 12px;margin-bottom:10px}.nxt .m{font-size:12px;color:var(--sub)}.nxt .a{font-size:11px;color:var(--sub);text-align:right}
.nt{display:inline-block;background:rgba(124,140,248,.16);border-radius:10px;padding:3px 9px;margin-top:5px;cursor:pointer}
@media (prefers-color-scheme:light){.nt{background:rgba(59,91,219,.10)}}
.t small.sy{display:inline;color:var(--sub);font-size:10.5px;margin-left:3px}
.rcT{cursor:pointer}.rcT .pv{color:var(--tx)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px 26px;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.sheet .hd2{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .ttl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.sheet .ttl b{font-size:15px;text-transform:uppercase}.sheet .ttl i{font-style:normal;color:var(--sub);font-size:18px;padding:0 4px;cursor:pointer}
.l0{--c:var(--red)}.l1{--c:var(--amb)}.l2{--c:var(--grn)}td.s{color:var(--c)}
/* V116: 상세 접기·모두 펼치기 버튼 + 펼친 회선을 카드로 분리 */
.bar2{display:flex;gap:8px;margin:0 -14px 6px;padding:8px 14px;align-items:stretch;position:sticky;top:0;z-index:5;background:var(--bg)}.bar2 .seg{flex:1;margin:0}
.ca2{flex:none;border:0;background:var(--card);color:var(--tx);border-radius:10px;padding:0 14px;font-size:13px;font-weight:600;min-height:44px;white-space:nowrap;cursor:pointer}
.ca2 i{font-style:normal;color:#7c8cf8;margin-right:5px;font-size:15px}
.ca2 u{text-decoration:none;display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:#7c8cf8;color:#fff;font-size:11.5px;text-align:center;margin-left:6px}
.ln.open{margin:8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c)}
.ln.open+.ln,.ln+.ln.open{border-top:1px solid var(--line)}
.ln.open .det{margin:0 10px}
</style></head><body>
<div class="top"><b>통화체크 현황</b><small id="upd">불러오는 중…</small></div>
<div class="bar2"><div class="seg"><button id="bL" class="on">카드·목록</button><button id="bT">표로 보기</button></div><button id="bC" class="ca2"><i>⇳</i><span>모두 펼치기</span><u style="display:none">0</u></button></div>
<div id="sum" class="sum"></div><div id="nxt"></div><div id="v"></div>
<script>
const URL_ = "https://script.google.com/macros/s/AKfycbx2BbwdKjUZDq78Xup1O8VgmCiqRZjzGdrsPrqoOKWjksNfGuC6UNdslBxRf1-luqtZGA/exec";   // Apps Script 배포 관리의 '웹 앱 URL'
let KEY = location.hash.slice(1);   // 주소 뒤 #키 — 서버로 전송되지 않고 이 폰에만 저장됨
try { if (KEY) localStorage.setItem('dc_key', KEY); else KEY = localStorage.getItem('dc_key') || ''; } catch (x) {}
let data = null, mode = 'list'; const open = new Set();
const $ = id => document.getElementById(id);
const E = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = t => { if (!t) return '-'; const d = new Date(t), n = new Date(); const s = d.toTimeString().slice(0,5);
  return d.toDateString() === n.toDateString() ? s : (n - d < 172800000 ? '어제' : (d.getMonth()+1)+'/'+d.getDate()); };
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a * 100 / b)) : 0;
const fmtMB = m => m >= 1000 ? (m / 1000).toFixed(2) + 'GB' : m + 'MB';   // 앱과 같은 1000 기준
const names = ['● 확인 필요', '● 주의', '● 정상'], cls = ['l0','l1','l2'];
const shut = new Set(); let armed = null; const openRc = new Set(); let sheetKey = null;   // V115: 최근 통화 펼침 · 다음 통화 창
const SETUP_ITEMS = [['perm','권한'],['loc','위치'],['bat','배터리 최적화'],['ovl','다른 앱 위 표시'],['fsi','전체 화면 알림'],['use','사용 정보'],['dnd','방해 금지']];   // 설정 점검 표시 항목 (V108)
function chips(r) { return ''; }   // V109: 배터리·설정 미비 칩 삭제 → 배터리는 오른쪽 시각 아래, 설정 미비는 사유 줄로
function lineBody(r) {
  const normal = r.level === 2;
  const dm = r.dataMB >= 0 ? `데이터 ${fmtMB(r.dataMB)}` : '';
  let h = `횟수 ${r.cnt}/${r.needCnt} · ${r.min}/${r.needMin}분<small>${E(r.tag)}`;
  if (normal) {   // 정상: 상태 · 데이터 · 기지국을 한 줄에
    const p = [dm, r.cell >= 0 ? `기지국 ${r.cell}회` : ''].filter(Boolean);
    h += p.length ? `<span style="color:var(--sub)"> · ${p.join(' · ')}</span>` : '';
    return h + '</small>';
  }
  h += '</small>';   // 비정상: 상태 / 사유 / 데이터·기지국 을 각각 한 줄로
  if (r.miss && r.miss.length) {
    const names = E(r.missNames.join(' · '));
    h += `<small class="why" style="color:var(--amb)">${/^설정 미비/.test(r.tag) ? names : `설정 미비 ${r.miss.length} · ${names}`}</small>`;
  }
  const q = [dm, r.cell >= 0 ? `기지국 변경 후 성공 ${r.cell}회` : ''].filter(Boolean);
  if (q.length) h += `<small style="color:var(--sub)">${q.join(' · ')}</small>`;
  return h;
}
function battHtml(r) { return r.batt >= 0 ? `<span class="bt${r.battLow ? ' lo' : ''}">🔋${r.batt}%${r.chg ? ' ⚡' : ''}</span>` : ''; }
function setupHtml(r) {
  if (!r.setupKnown) return '';
  return `<div class="grp" style="margin:10px 0 2px">설정 점검${r.miss.length ? ` <span style="color:var(--amb);font-weight:400">· ${r.miss.length}가지 미비</span>` : ' <span style="color:var(--grn);font-weight:400">· 모두 정상</span>'}</div><div class="g" style="margin-top:0">${SETUP_ITEMS.map(([c, n]) => `<span>${n} <b style="color:var(--${r.miss.indexOf(c) >= 0 ? 'red' : 'grn'})">${r.miss.indexOf(c) >= 0 ? '✗ 안 됨' : '✓'}</b></span>`).join('')}</div>`;
}
const D9 = t => new Date(t + 9 * 3600000);   // 한국 날짜 기준 (예정일별은 0시(한국) 값)
const mdK = t => { const d = D9(t); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };
const hmK = t => { const d = D9(t); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
const dayK = t => { const a = Math.floor(D9(t) / 86400000), b = Math.floor(D9(Date.now()) / 86400000); return a === b ? '오늘' : a === b - 1 ? '어제' : mdK(t); };
const durK = s => Math.floor(s / 60) + '분 ' + (s % 60) + '초';
const untilK = ms => { const m = Math.round(ms / 60000); return m < 1 ? '곧' : (m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60) + '분 뒤' : m + '분 뒤'); };
const nxS = t => { const a = Math.floor(D9(t) / 86400000), b = Math.floor(D9(Date.now()) / 86400000); return a === b ? hmK(t) : mdK(t) + ' ' + hmK(t); };   // V115: 오늘이면 시각만, 아니면 날짜+시각
const hasNx = r => r.recentKnown && r.auto && r.nextAt > Date.now();
function nextHtml(r) { return hasNx(r) ? `<span class="nt" data-nx="${E(r.key)}">▶ ${nxS(r.nextAt)}</span>` : ''; }   // V115 ①: 접은 줄 오른쪽 다음 통화
function nextTopHtml(R) {   // V115 ②: 맨 위 — 전체에서 가장 빠른 다음 통화
  const c = R.filter(hasNx).sort((a, b) => a.nextAt - b.nextAt)[0];
  if (!c) return '';
  return `<div class="nxt"><div><div class="m">다음 통화</div><b class="nxb">${dayK(c.nextAt)} ${hmK(c.nextAt)}경</b> <span class="m">· ${untilK(c.nextAt - Date.now())}</span></div><div class="a"><b style="color:var(--tx);font-size:14px;text-transform:uppercase">${E(c.label)}</b>${c.member ? '<br>' + E(c.group) : ''}</div></div>`;
}
function nextBox(r) {   // V115: 다음 통화 예정 — ▶ 시각을 누르면 아래에서 올라오는 창에 표시
  if (!r.recentKnown) return '';
  const now = Date.now();
  let main;
  if (!r.auto) main = '<span class="nx0">자동 통화 꺼짐</span>';
  else if (r.nextAt > now) main = `<b class="nxb">${dayK(r.nextAt)} ${hmK(r.nextAt)}경</b> <span class="m">· ${untilK(r.nextAt - now)}</span>`;
  else if (r.nextToday > 0 || r.nextDays.length) main = '<b class="nxb">시각 계산 중</b>';
  else main = '<span class="nx0">예정된 통화 없음</span>';
  let chips = '';
  if (r.auto) {
    if (r.nextToday > 0) chips += `<span class="cp">오늘 남은 <b>${r.nextToday}회</b></span>`;
    chips += r.nextDays.slice(0, 3).map(x => `<span class="cp">${mdK(x.t)} <b>${x.n}회</b></span>`).join('');
    if (r.nextDays.length > 3) chips += '<span class="cp">…</span>';
  }
  return `<div class="nx"><div>${main}</div>${chips}</div>`;
}
function planHtml(r) {   // V115: 최근 통화 5건 — 눌러야 펼침(접힌 상태엔 가장 최근 1건만)
  if (!r.recentKnown) return '';
  const rc = r.recent.length ? r.recent.map(c => {
    const bad = c.s <= 0;
    return `<div><span class="w">${dayK(c.t)} ${hmK(c.t)}</span><span class="${c.k === 'O' ? 'o' : 'i'}">${c.k === 'O' ? '발신' : '수신'}</span><span class="r${bad ? ' x' : ''}">${bad ? (c.k === 'M' ? '부재중' : '연결 안 됨') : durK(c.s)}</span></div>`;
  }).join('') : '<div><span class="w">아직 통화 기록이 없어요</span></div>';
  const c0 = r.recent[0], op = openRc.has(r.key);
  const pv = c0 ? `${dayK(c0.t)} ${hmK(c0.t)} ${c0.k === 'O' ? '발신' : '수신'} ${c0.s <= 0 ? (c0.k === 'M' ? '부재중' : '연결 안 됨') : durK(c0.s)}` : '기록 없음';
  return `<div class="sec rcT" data-rc="${E(r.key)}"><b>최근 통화 5건</b><span>${op ? '▾' : `<span class="pv">${pv}</span> ▸`}</span></div>` + (op ? `<div class="rc">${rc}</div>` : '');
}
function line(r) {
  const o = open.has(r.key) ? ' open' : '';
  return `<div class="ln ${cls[r.level]}${o}" data-id="${E(r.key)}"><div class="lh"><b>${E(r.label)}</b>
   <div class="n">${lineBody(r)}<div class="bar"><i style="width:${pct(r.cnt, r.needCnt)}%"></i></div></div><div class="t">${hm(r.ts)}<small class="sy">동기화</small>${battHtml(r)}${nextHtml(r)}</div></div>
   <div class="det"><div class="g"><span>요금제 <b>${E(r.plan || '-')}</b></span><span>앱 <b>${E(r.ver)}</b></span>
   <span>발신/수신(이번 달) <b>${r.out} / ${r.inn}</b></span><span>자동 통화 <b>${r.auto ? '켜짐' : '꺼짐'}</b></span>
   <span>기본 전화앱 <b>${r.dialer ? '예' : '아니오'}</b></span><span>소리샘 보호 <b>${r.guard ? '켜짐' : '꺼짐'}</b></span>
   <span>마지막 통화 <b>${hm(r.lastCall)}</b></span><span>${E(r.carrier)} <b>${E(r.model)}</b></span>${r.batt >= 0 ? `<span>배터리 <b>${r.batt}%${r.chg ? ' · 충전 중' : ' · 충전 안 함'}</b></span>` : ''}</div>${planHtml(r)}${setupHtml(r)}${data.canDel ? `<button class="dl${armed === r.key ? ' on' : ''}" data-k="${E(r.key)}">${armed === r.key ? '한 번 더 누르면 삭제' : '이 줄 삭제'}</button>` : ''}</div></div>`;
}
function groups(R) {
  const m = new Map();
  R.forEach(r => { if (!m.has(r.group)) m.set(r.group, []); m.get(r.group).push(r); });
  return [...m].map(([name, list]) => ({ name, list, lv: Math.min(...list.map(r => r.level)) }))
    .sort((a, b) => a.lv - b.lv || a.name.localeCompare(b.name, 'ko', { numeric: true }));
}
function groupHtml(g) {
  const bad = g.list.filter(r => r.level === 0).length, warn = g.list.filter(r => r.level === 1).length;
  const info = g.list.length + '회선 · ' + (bad ? '확인 필요 ' + bad : warn ? '주의 ' + warn : '정상');
  const sh = shut.has(g.name) ? ' shut' : '';
  return `<div class="gp${sh}" data-g="${E(g.name)}"><div class="gh"><div>${E(g.name)}</div><span>${info} ${sh ? '▸' : '▾'}</span></div>${g.list.map(line).join('')}</div>`;
}
function drawSheet() {   // V115: ▶ 다음 통화 시각을 누르면 뜨는 창(바깥·✕ 누르면 닫힘)
  let el = $('sh');
  const r = sheetKey && data ? data.rows.find(x => x.key === sheetKey) : null;
  if (!r || !hasNx(r)) { sheetKey = null; if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sh'; document.body.appendChild(el); }
  el.innerHTML = `<div class="ov"></div><div class="sheet"><div class="hd2"></div><div class="ttl"><b>${E(r.label)} · 다음 통화 예정</b><i class="sx">✕</i></div>${nextBox(r)}<div class="m" style="color:var(--sub);font-size:11px;margin-top:10px">자동 발신 기준 · 바깥을 누르면 닫혀요</div></div>`;
}
function render() { renderMain(); syncBC(); }
function renderMain() {
  if (!data) return;
  drawSheet();
  const R = data.rows, c = [0,1,2].map(l => R.filter(r => r.level === l));
  $('sum').innerHTML = `<span style="color:var(--red)">확인 필요 <b>${c[0].length}</b></span><span style="color:var(--amb)">주의 <b>${c[1].length}</b></span><span style="color:var(--grn)">정상 <b>${c[2].length}</b></span>${R.some(r => r.cell >= 0) ? `<span style="color:var(--sub)">변경 후 성공 <b>${R.reduce((a, r) => a + Math.max(r.cell, 0), 0)}</b></span>` : ''}`;
  $('upd').textContent = '● ' + new Date(data.now).toTimeString().slice(0,5) + ' 갱신 · 15초마다 자동';
  $('nxt').innerHTML = nextTopHtml(R);
  if (mode === 'table') {
    $('v').innerHTML = '<table><tr><th>번호</th><th>요금제</th><th>횟수</th><th>시간</th><th>상태</th><th>동기화</th></tr>' +
      R.map(r => `<tr class="${cls[r.level]}"><td>${E(r.full)}</td><td>${E(r.plan)}</td><td>${r.cnt}/${r.needCnt}</td><td>${r.min}/${r.needMin}</td><td class="s">${E(r.tag)}</td><td>${hm(r.ts)}</td></tr>`).join('') + '</table>';
    return;
  }
  const h = groups(R).map(groupHtml).join('');
  $('v').innerHTML = h || '<div class="more">아직 보고한 폰이 없어요</div>';
}
function load() {
  $('upd').textContent = '불러오는 중…';
  fetch(URL_ + '?key=' + encodeURIComponent(KEY) + '&json=1')
    .then(r => r.json())
    .then(d => { data = d; render(); })
    .catch(e => { $('upd').textContent = '연결 실패: ' + e; });
}
document.addEventListener('click', e => {
  if (e.target.closest('.ov, .sx')) { sheetKey = null; drawSheet(); return; }
  const nt = e.target.closest('.nt'); if (nt) { sheetKey = nt.dataset.nx; drawSheet(); return; }
  const rt = e.target.closest('.rcT'); if (rt) { const k = rt.dataset.rc; openRc.has(k) ? openRc.delete(k) : openRc.add(k); render(); return; }
  const d = e.target.closest('.dl');
  if (d) { const k = d.dataset.k;
    if (armed === k) { armed = null; fetch(URL_ + '?key=' + encodeURIComponent(KEY) + '&del=' + encodeURIComponent(k)).then(r => r.json()).then(x => { if (x.ok) load(); else $('upd').textContent = '삭제 실패: ' + (x.error || ''); }).catch(er => { $('upd').textContent = '삭제 실패: ' + er; }); }
    else { armed = k; render(); setTimeout(() => { if (armed === k) { armed = null; render(); } }, 4000); }
    return; }
  const h = e.target.closest('.gh'); if (h) { const n = h.parentNode.dataset.g; shut.has(n) ? shut.delete(n) : shut.add(n); render(); return; }
  const l = e.target.closest('.ln'); if (l && e.target.closest('.lh')) { const id = l.dataset.id; open.has(id) ? open.delete(id) : open.add(id); l.classList.toggle('open'); syncBC(); }
});
// V116: 상세 접기 / 모두 펼치기 (열린 회선 상세가 있으면 '상세 접기', 없으면 '모두 펼치기')
const nOpen = () => data ? data.rows.filter(r => open.has(r.key)).length : 0;
function syncBC() {
  const b = $('bC'); if (!b) return;
  b.style.display = mode === 'table' ? 'none' : '';
  const n = nOpen(), u = b.querySelector('u');
  b.querySelector('span').textContent = n ? '상세 접기' : '모두 펼치기';
  b.querySelector('i').textContent = n ? '⇕' : '⇳';
  u.textContent = n; u.style.display = n ? 'inline-block' : 'none';
}
$('bC').onclick = () => {
  if (!data) return;
  if (nOpen()) { open.clear(); openRc.clear(); }
  else { shut.clear(); data.rows.forEach(r => open.add(r.key)); }
  render();
};
$('bL').onclick = () => { mode = 'list'; $('bL').className = 'on'; $('bT').className = ''; render(); };
$('bT').onclick = () => { mode = 'table'; $('bT').className = 'on'; $('bL').className = ''; render(); };
window.onerror = (m) => { $('upd').textContent = '화면 오류: ' + m; };
if (!KEY || URL_.indexOf('http') !== 0) $('upd').textContent = !KEY ? '주소 뒤에 #보기키 를 붙여 주세요' : '웹 앱 주소(URL_)가 비어 있어요';
else { load(); setInterval(load, 15000); }
</script></body></html>
