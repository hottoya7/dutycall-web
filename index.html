  const est = !cs.res ? `<div class="ex">${base ? '예상 시작 ' + (base <= now ? '곧' : '약 ' + hmK(base)) + ' (기본 폰은 다음 동기화 때)' : '예상 시작 약 5분 안에'}</div>` : '';
  const stp = (v, k, lo, hi, c) => `<div class="stp${c || ''}"><button data-st="${k}" data-d="-1"${v <= lo ? ' disabled' : ''}>−</button><b>${v}회</b><button data-st="${k}" data-d="1"${v >= hi ? ' disabled' : ''}>+</button></div>`;
  const lbl = `기본 ${DEF(cs.min)} · 최대 ${cap}`;
  const cntH = cs.range
    ? `<div class="hr" style="margin-bottom:2px"><span class="lb" style="margin:0">횟수 <small style="display:inline">${lbl}</small></span><a class="lk" data-ed="range">◂ 한 숫자로</a></div><div class="rg"><span>최소</span>${stp(cs.a, 'a', 1, Math.min(cs.b, cap), ' r')}<span>최대</span>${stp(cs.b, 'b', cs.a, cap, ' r')}</div>`
    : `<div class="hr" style="margin-bottom:0"></div><div class="cnt"><div class="lb">횟수<small>${lbl}</small></div>${stp(cs.a, 'ab', 1, cap, ' r')}</div><a class="lk" data-ed="range">범위로 ▸</a>`;
  const sub = [nF ? '빨리 받기 ' + nF : '', nB ? '기본 ' + nB : ''].filter(Boolean).join(' · ');
  el.innerHTML = `<div class="ov" data-csx="1"></div><div class="sheet"><div class="hd2"></div>
   <div class="ttl"><b>${n}대에 통화 시작</b><i data-csx="1">✕</i></div>
   <div class="sub2">${sub}</div>
   ${R.map(r => `<div class="pl">${E(String(r.full).toUpperCase())}<span class="${r.fast === 1 ? 'f' : ''}">${r.fast === 1 ? '빨리 받기 · 최대 5분' : '기본 · 최대 30분'}</span></div>`).join('')}
   <div class="hr">언제 시작<b>${cs.res ? (okA0 ? cs.after + '분 뒤 · ' + hmK(at) : '—') : '바로'}</b>${cs.res ? `<a data-ed="after">${cs.edA ? '닫기' : '직접 입력'}</a>` : ''}</div>
   <div class="seg2"><button data-res="0" class="${cs.res ? '' : 'on'}">바로 시작</button><button data-res="1" class="${cs.res ? 'on' : ''}">예약 시작</button></div>
   ${est}${warn}
   ${cs.res ? (cs.edA ? `<input type="number" inputmode="numeric" min="1" max="240" data-in="after" value="${cs.after}" placeholder="1~240분">` : '') + c5([5, 10, 20, 30, 60], cs.after, 'after', m => !afterOk(m)) : ''}
   <div class="hr">몇 분 동안<b>${okM ? cs.min + '분' : '—'}</b><a data-ed="min">${cs.edM ? '닫기' : '직접 입력'}</a></div>
   ${cs.edM ? `<input type="number" inputmode="numeric" min="5" max="240" data-in="min" value="${cs.min}" placeholder="5~240분">` : ''}${c5([5, 10, 30, 60, 120], cs.min, 'min')}
   ${cntH}
   ${cs.err ? `<div class="er">${E(cs.err)}</div>` : ''}${!okA0 ? '<div class="er">몇 분 뒤는 1~240분</div>' : !okL ? `<div class="er">기본 폰은 다음 동기화(약 ${hmK(base)}) 전에는 받을 수 없어 ${hmK(lim)} 이전은 예약할 수 없어요</div>` : !okM ? '<div class="er">시간은 5~240분</div>' : !okC ? `<div class="er">${cs.min}분은 최대 ${cap}회</div>` : ''}
   <div class="bt2"><button class="b0" data-csx="1">취소</button><button class="b1" data-go="1"${okA && okM && okC && n && !cs.busy ? '' : ' disabled'}>${cs.busy ? '보내는 중…' : cs.res ? n + '대 · ' + hmK(at) + ' 예약' : n + '대 시작'}</button></div></div>`;
  const sh1 = el.querySelector('.sheet'); if (sh1) sh1.scrollTop = top0;
}
function csSend() {
  const R = data.rows.filter(r => sel.has(r.key)), { at } = csCalc();
  cs.busy = true; cs.err = ''; drawCs();
  try { localStorage.setItem('dc_cs', JSON.stringify({ res: cs.res, after: cs.after, min: cs.min, a: cs.a, b: cs.b, range: cs.range })); } catch (x) {}
  const q = '&cmd=new&rows=' + encodeURIComponent(JSON.stringify(R.map(r => r.key))) + '&kind=' + (cs.res ? 'res' : 'now') + '&at=' + at + '&min=' + cs.min + '&a=' + cs.a + '&b=' + cs.b;
  fetch(URL_ + '?key=' + encodeURIComponent(KEY) + q).then(r => r.json()).then(x => {
    if (!x.ok) { cs.busy = false; cs.err = '보내지 못했어요: ' + (x.error || ''); drawCs(); return; }
    setSel(false); load();
  }).catch(er => { cs.busy = false; cs.err = '보내지 못했어요: ' + er; drawCs(); });
}
document.addEventListener('click', e => {   // 선택 모드·창 (기존 클릭 처리보다 먼저)
  const t = e.target;
  if (lpFired) { lpFired = false; e.stopImmediatePropagation(); return; }
  if (t.closest('#bS')) { setSel(!sel); e.stopImmediatePropagation(); return; }
  const cx = t.closest('.cx');
  const un = t.closest('[data-un]');
  if (un) { e.stopImmediatePropagation(); const p = pc.get(un.dataset.un); if (p) { clearTimeout(p.t); p.el.remove(); pc.delete(un.dataset.un); render(); } return; }
  if (cx) { e.stopImmediatePropagation(); cxQueue(cx.dataset.cx); return; }
  const sb = t.closest('[data-sb]');
  if (sb) { e.stopImmediatePropagation(); if (sb.dataset.sb === 'x') setSel(false); else { cs = Object.assign(csDef(), { err: '', busy: false, edA: false, edM: false }); if (cs.b > CAP(cs.min)) cs.a = cs.b = DEF(cs.min); fixAfter(); drawCs(); } return; }
  if (t.closest('#cs')) {
    e.stopImmediatePropagation();
    if (t.closest('[data-csx]')) { cs = null; drawCs(); return; }
    if (cs.busy) return;
    const d = t.closest('button, a'); if (!d) return;
    if (d.dataset.res) { cs.res = d.dataset.res === '1'; if (cs.res) fixAfter(); }
    else if (d.dataset.c5) { if (d.disabled) return; const v = +d.dataset.v; if (d.dataset.c5 === 'min') { cs.min = v; cs.a = cs.b = DEF(v); } else cs.after = v; }
    else if (d.dataset.ed === 'after') cs.edA = !cs.edA;
    else if (d.dataset.ed === 'min') cs.edM = !cs.edM;
    else if (d.dataset.ed === 'range') { cs.range = !cs.range; if (!cs.range) cs.b = cs.a; }
    else if (d.dataset.st) { if (e.detail === 0) stepCs(d.dataset.st, +d.dataset.d); else return; }   // 마우스·터치는 pointerdown 에서 처리(길게 누르면 반복), 키보드만 여기서
    else if (d.dataset.go) { csSend(); return; }
    cs.err = ''; drawCs(); return;
  }
  if (!sel) return;
  const ga = t.closest('.ga');
  if (ga) { e.stopImmediatePropagation(); const g = groups(data.rows).find(x => x.name === ga.dataset.ga); if (!g) return;
    const L = g.list.filter(canSel), all = L.length && L.every(r => sel.has(r.key)); L.forEach(r => all ? sel.delete(r.key) : sel.add(r.key)); selBar(); render(); return; }
  const l = t.closest('.ln');
  if (l && t.closest('.lh')) { e.stopImmediatePropagation(); const r = data.rows.find(x => x.key === l.dataset.id); if (!r || !canSel(r)) return;
    sel.has(r.key) ? sel.delete(r.key) : sel.add(r.key); selBar(); render(); }
}, true);
document.addEventListener('input', e => {   // 직접 입력 칸 (창을 다시 그리지 않고 값·버튼만 반영)
  const i = e.target.closest('#cs input'); if (!i || !cs) return;
  const v = parseInt(i.value, 10) || 0;
  if (i.dataset.in === 'after') cs.after = v; else { cs.min = v; if (v >= 5 && v <= 240) cs.a = cs.b = DEF(v); }
  clearTimeout(i._t); i._t = setTimeout(() => { const k = i.dataset.in, p = i.selectionStart; drawCs(); const j = document.querySelector(`#cs input[data-in="${k}"]`); if (j) { j.focus(); try { j.setSelectionRange(p, p); } catch (x) {} } }, 350);
});
function cxSend(id) { fetch(URL_ + '?key=' + encodeURIComponent(KEY) + '&cmd=cancel&id=' + encodeURIComponent(id), { keepalive: true }).then(r => r.json()).then(x => { if (!x.ok) $('upd').textContent = '취소 실패: ' + (x.error || ''); load(); }).catch(() => load()); }
function cxQueue(id) {   // V120: 취소 명령은 5초 뒤에 보냄 — 그 안에 [되돌리기]를 누르면 보내지 않음
  if (pc.has(id)) return;
  const c = data && data.cmds ? data.cmds.find(x => x.id === id) : null;
  let box = $('ut'); if (!box) { box = document.createElement('div'); box.id = 'ut'; box.className = 'ut'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'ui';
  el.innerHTML = `<span>${c && c.kind === '예약' ? hmK(c.at) + ' 예약' : '바로 시작'} 취소</span><button data-un="${E(id)}">되돌리기</button>`;
  box.appendChild(el);
  const t = setTimeout(() => { pc.delete(id); el.remove(); cxSend(id); }, 5000);
  pc.set(id, { t, el });
  render();
}
window.addEventListener('pagehide', () => { pc.forEach((p, id) => { clearTimeout(p.t); cxSend(id); }); pc.clear(); });   // 5초 안에 페이지를 닫아도 취소는 보냄
let stT = null, stI = null;   // 스테퍼 길게 누르기 반복
function stopSt() { clearTimeout(stT); clearInterval(stI); stT = stI = null; }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#cs [data-st]'); if (!b || b.disabled || !cs || cs.busy) return;
  const k = b.dataset.st, d = +b.dataset.d, go = () => { const a0 = cs.a + ',' + cs.b; stepCs(k, d); cs.err = ''; drawCs(); return a0 !== cs.a + ',' + cs.b; };
  go();
  stT = setTimeout(() => { stI = setInterval(() => { if (!go()) stopSt(); }, 90); }, 400);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, stopSt, true));
let lpT = null, lpX = 0, lpY = 0;   // 줄 길게 누르기 → 선택 모드
document.addEventListener('pointerdown', e => {
  const lh = e.target.closest('.lh'); if (!lh || sel || !data || !data.canDel || mode !== 'list') return;
  const k = lh.parentNode.dataset.id; lpX = e.clientX; lpY = e.clientY;
  lpT = setTimeout(() => { lpT = null; const r = data.rows.find(x => x.key === k); setSel(true); if (r && canSel(r)) sel.add(k); lpFired = true; selBar(); render(); try { navigator.vibrate && navigator.vibrate(20); } catch (x) {} }, 550);
});
['pointerup', 'pointercancel', 'scroll'].forEach(ev => document.addEventListener(ev, () => { if (lpT) { clearTimeout(lpT); lpT = null; } if (lpFired && ev !== 'scroll') setTimeout(() => { lpFired = false; }, 0); }, true));   // 길게 누른 뒤 손을 떼면 뒤따르는 클릭 1번만 무시
document.addEventListener('pointermove', e => { if (lpT && Math.abs(e.clientX - lpX) + Math.abs(e.clientY - lpY) > 12) { clearTimeout(lpT); lpT = null; } });
document.addEventListener('contextmenu', e => { if (e.target.closest('.lh, .stp')) e.preventDefault(); });
window.onerror = (m) => { $('upd').textContent = '화면 오류: ' + m; };
if (!KEY || URL_.indexOf('http') !== 0) $('upd').textContent = !KEY ? '주소 뒤에 #보기키 를 붙여 주세요' : '웹 앱 주소(URL_)가 비어 있어요';
else { load(); setInterval(load, 15000); }
</script></body></html>
